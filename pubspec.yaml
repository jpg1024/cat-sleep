name: cat_sleep
description: "Windows 定时关机客户端 - 支持工作日/调休/开机自启"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tray_manager: ^0.5.0
  window_manager: ^0.4.0
  shared_preferences: ^2.5.0
  http: ^1.3.0
  path_provider: ^2.1.0
  intl: ^0.20.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animals/
